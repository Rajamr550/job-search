name: Deploy status report to GitHub Pages

on:
  # PAUSED: automation halted. Uncomment the triggers below to resume.
  # push:
  #   branches: [main, master]
  #   paths:
  #     - "docs/**"
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["Run job agent"]
  #   types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
